<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoring Environment</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
    background: #eef2f7; color: #1e293b; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }

  /* ================= LOGIN PAGE (UPGRADED) ================= */
  #loginPage {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    background: #0f172a;
    position: relative; overflow: hidden;
    padding: 20px;
  }

  /* Aurora blobs */
  .aurora {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6;
    animation: float 20s infinite alternate ease-in-out;
    z-index: 0;
  }
  .aurora-1 {
    width: 500px; height: 500px; background: #2563eb;
    top: -150px; left: -100px;
  }
  .aurora-2 {
    width: 400px; height: 400px; background: #06b6d4;
    bottom: -100px; right: -50px;
    animation-delay: -5s; animation-duration: 25s;
  }
  .aurora-3 {
    width: 300px; height: 300px; background: #a855f7;
    top: 40%; left: 60%;
    animation-delay: -10s; animation-duration: 30s;
  }

  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(50px, 30px) scale(1.1); }
    100% { transform: translate(-30px, -20px) scale(0.9); }
  }

  /* Grid overlay */
  #loginPage::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
    z-index: 1; pointer-events: none;
  }

  /* Particles container */
  #particles {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
  }
  .particle {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: rgba(255,255,255,.7);
    box-shadow: 0 0 10px 2px rgba(59,130,246,.6);
    animation: particleFloat 15s infinite linear;
  }
  @keyframes particleFloat {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* Login Box */
  .login-box {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 48px 42px;
    border-radius: 24px;
    width: 420px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05) inset;
    position: relative; z-index: 2;
    animation: slideUp 0.7s cubic-bezier(.16,1,.3,1);
  }
  @keyframes slideUp {
    from { transform: translateY(40px) scale(.95); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  .login-logo {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, #3b82f6, #06b6d4);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; margin-bottom: 24px;
    box-shadow: 0 8px 30px rgba(59,130,246,.5);
    animation: pulse 2.5s infinite;
    position: relative;
  }
  .login-logo::after {
    content: ''; position: absolute; inset: -4px; border-radius: 24px;
    border: 2px solid rgba(59,130,246,.4);
    animation: ripple 2.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 8px 30px rgba(59,130,246,.5); }
    50% { transform: scale(1.05); box-shadow: 0 8px 40px rgba(59,130,246,.8); }
  }
  @keyframes ripple {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  .login-box h1 {
    font-size: 28px; margin-bottom: 8px;
    background: linear-gradient(135deg, #fff, #93c5fd);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800; letter-spacing: -1px;
  }
  .login-box p { font-size: 14px; color: #94a3b8; margin-bottom: 32px; }
  
  .input-group { position: relative; margin-bottom: 20px; }
  .input-group label {
    position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
    font-size: 14px; color: #94a3b8; font-weight: 600;
    pointer-events: none; transition: all 0.2s ease;
    background: transparent; padding: 0 4px;
  }
  .input-group input {
    width: 100%; padding: 16px 18px;
    background: rgba(255,255,255,.03);
    border: 2px solid rgba(255,255,255,.1);
    border-radius: 12px;
    font-size: 16px; color: #fff;
    font-family: inherit; font-weight: 600; letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: all 0.3s ease;
  }
  .input-group input:focus {
    outline: none; border-color: #3b82f6;
    background: rgba(59,130,246,.1);
    box-shadow: 0 0 0 4px rgba(59,130,246,.2), 0 0 20px rgba(59,130,246,.3);
  }
  /* Label animation ketika input focus atau ada isinya */
  .input-group input:focus + label,
  .input-group input:not(:placeholder-shown) + label {
    top: 0; left: 14px;
    font-size: 11px; color: #60a5fa;
    background: #0f172a; padding: 0 6px;
    text-transform: uppercase; letter-spacing: 1px;
  }

  .err { color: #f87171; font-size: 13px; margin-bottom: 12px; min-height: 18px; font-weight: 600; }
  
  .btn-main {
    width: 100%; padding: 16px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: #fff; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    position: relative; overflow: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(37,99,235,.4);
    margin-top: 10px;
  }
  .btn-main::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
    transition: left 0.5s ease;
  }
  .btn-main:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(37,99,235,.6); }
  .btn-main:hover::before { left: 100%; }
  .btn-main:active { transform: translateY(0); }

  .hint {
    margin-top: 28px; padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,.08);
    font-size: 12.5px; color: #64748b; line-height: 1.8;
  }
  .hint b { color: #cbd5e1; }
  .hint code {
    background: rgba(59,130,246,.15); padding: 3px 8px; border-radius: 6px;
    color: #93c5fd; font-weight: 700; font-family: 'Courier New', monospace;
    border: 1px solid rgba(59,130,246,.2);
  }
  .btn-reset {
    margin-top: 12px; background: rgba(255,255,255,.05); color: #cbd5e1;
    border: 1px solid rgba(255,255,255,.1); padding: 8px 16px;
    border-radius: 8px; font-size: 12px; cursor: pointer;
    font-family: inherit; font-weight: 600; transition: all 0.2s;
  }
  .btn-reset:hover { background: rgba(255,255,255,.1); color: #fff; }

  /* APP SHELL */
  header.topbar {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #fff; padding: 0 28px;
    display: flex; align-items: center; justify-content: space-between; height: 64px;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
    position: sticky; top: 0; z-index: 100;
  }
  header.topbar .brand {
    display: flex; align-items: center; gap: 12px;
    font-weight: 800; font-size: 16px; letter-spacing: .3px;
  }
  header.topbar .brand .dot {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, #2563eb, #06b6d4);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    box-shadow: 0 4px 12px rgba(37,99,235,.4);
  }
  header.topbar .userinfo { display: flex; align-items: center; gap: 14px; font-size: 13px; }
  header.topbar .uname { font-weight: 700; }
  header.topbar .badge {
    background: linear-gradient(135deg, #3b82f6, #06b6d4);
    padding: 5px 12px; border-radius: 20px; font-weight: 700; font-size: 11.5px;
    letter-spacing: .4px; box-shadow: 0 2px 8px rgba(59,130,246,.4);
  }
  header.topbar .badge.super {
    background: linear-gradient(135deg, #a855f7, #ec4899);
    box-shadow: 0 2px 8px rgba(168,85,247,.45);
  }
  header.topbar button.logout {
    background: rgba(220,38,38,.15); color: #fca5a5; border: 1px solid rgba(220,38,38,.4);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px;
    font-family: inherit; font-weight: 700; transition: all .15s;
  }
  header.topbar button.logout:hover { background: #dc2626; color: #fff; border-color: #dc2626; }

  nav.tabs {
    background: #fff; display: flex; gap: 4px; padding: 0 28px;
    border-bottom: 1px solid #e2e8f0; box-shadow: 0 1px 3px rgba(0,0,0,.04);
    position: sticky; top: 64px; z-index: 99;
  }
  nav.tabs button {
    background: none; border: none; padding: 16px 22px; cursor: pointer;
    font-size: 14px; font-weight: 700; color: #64748b;
    border-bottom: 3px solid transparent; font-family: inherit;
    transition: all .15s;
  }
  nav.tabs button:hover { color: #1e40af; background: #f8fafc; }
  nav.tabs button.active { color: #1e40af; border-bottom-color: #2563eb; }
  main { padding: 28px; max-width: 1500px; margin: 0 auto; }

  h2.page-title {
    font-size: 22px; margin-bottom: 20px; color: #0f172a; font-weight: 800;
    letter-spacing: -.5px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  h2.page-title .sub { font-size: 13px; font-weight: 500; color: #64748b; }
  .card {
    background: #fff; border-radius: 16px; padding: 22px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    margin-bottom: 22px; border: 1px solid rgba(226,232,240,.8);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table th, table td { padding: 11px 13px; text-align: left; border-bottom: 1px solid #eef2f7; }
  table th { background: #f8fafc; font-size: 11.5px; text-transform: uppercase; color: #475569; letter-spacing: .5px; font-weight: 800; }
  table tr:hover td { background: #f8fafc; }
  .btn {
    border: none; border-radius: 8px; padding: 8px 14px; font-size: 12.5px;
    cursor: pointer; font-weight: 700; font-family: inherit;
    transition: transform .1s, box-shadow .15s, background .15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: linear-gradient(135deg, #2563eb, #1e40af); color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,.3); }
  .btn-primary:hover { box-shadow: 0 6px 18px rgba(37,99,235,.4); }
  .btn-danger { background: #fee2e2; color: #b91c1c; }
  .btn-danger:hover { background: #fecaca; }
  .btn-edit { background: #fef3c7; color: #92400e; }
  .btn-edit:hover { background: #fde68a; }
  .btn-secondary { background: #e2e8f0; color: #334155; }
  .btn-secondary:hover { background: #cbd5e1; }
  .btn-export {
    background: linear-gradient(135deg, #16a34a, #15803d); color: #fff;
    box-shadow: 0 4px 12px rgba(22,163,74,.3);
  }
  .btn-export:hover { box-shadow: 0 6px 18px rgba(22,163,74,.4); }
  .btn-sm { padding: 6px 11px; font-size: 12px; }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
  .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 140px; }
  .field label { font-size: 11.5px; font-weight: 800; color: #475569; text-transform: uppercase; letter-spacing: .4px; }
  .field input, .field select {
    padding: 10px 13px; border: 2px solid #e2e8f0; border-radius: 9px; font-size: 14px;
    font-family: inherit; font-weight: 500; transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,.12); }
  .empty { color: #94a3b8; font-size: 13.5px; padding: 16px 0; text-align: center; }

  /* Scorecards */
  .area-group { margin-bottom: 26px; }
  .area-group h3 {
    font-size: 13px; text-transform: uppercase; color: #1e40af;
    margin-bottom: 12px; letter-spacing: .8px; font-weight: 800;
    display: flex; align-items: center; gap: 8px;
  }
  .area-group h3::before {
    content: ''; width: 4px; height: 16px; border-radius: 2px;
    background: linear-gradient(180deg, #2563eb, #06b6d4);
  }
  .scorecards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .scorecard {
    background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
    border: 2px solid #e2e8f0; border-radius: 16px;
    padding: 20px 18px; cursor: pointer;
    transition: all .2s cubic-bezier(.16,1,.3,1); text-align: left;
    position: relative; overflow: hidden;
  }
  .scorecard::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #2563eb, #06b6d4);
    opacity: 0; transition: opacity .2s;
  }
  .scorecard:hover {
    border-color: #3b82f6; transform: translateY(-4px);
    box-shadow: 0 12px 28px rgba(37,99,235,.18);
  }
  .scorecard:hover::before { opacity: 1; }
  .scorecard .room { font-size: 22px; font-weight: 800; color: #0f172a; letter-spacing: -.5px; }
  .scorecard .sub { font-size: 11px; color: #64748b; margin-top: 4px; text-transform: uppercase; font-weight: 700; letter-spacing: .4px; }
  .scorecard .pcount {
    font-size: 11px; margin-top: 10px; color: #1e40af; font-weight: 800;
    background: linear-gradient(135deg, #dbeafe, #bfdbfe);
    display: inline-block; padding: 4px 10px; border-radius: 20px;
  }

  .shift-status {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px;
  }
  .shift-chip {
    font-size: 10px; font-weight: 800; text-align: center;
    padding: 5px 4px; border-radius: 6px; letter-spacing: .3px;
    border: 1px solid #e2e8f0; background: #f8fafc; color: #94a3b8;
  }
  .shift-chip.filled {
    background: linear-gradient(135deg, #dcfce7, #bbf7d0);
    color: #15803d; border-color: #86efac;
  }
  .shift-chip.filled.ng {
    background: linear-gradient(135deg, #fee2e2, #fecaca);
    color: #b91c1c; border-color: #fca5a5;
  }
  .scorecard.full {
    border-color: #86efac;
    background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
  }
  .scorecard.full:hover { border-color: #16a34a; }
  .scorecard.full::before { background: linear-gradient(90deg, #16a34a, #22c55e); }

  /* Dashboard */
  .filter-bar {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end;
    background: #fff; padding: 18px 22px; border-radius: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    margin-bottom: 22px; border: 1px solid rgba(226,232,240,.8);
  }
  .filter-bar .field { max-width: 240px; min-width: 200px; flex: 0 1 auto; }
  .dept-info {
    display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700;
    color: #1e40af; background: linear-gradient(135deg, #dbeafe, #bfdbfe);
    padding: 10px 16px; border-radius: 10px; border: 1px solid #93c5fd;
    margin-left: auto;
  }
  .dept-info.super {
    color: #7e22ce; background: linear-gradient(135deg, #fae8ff, #e9d5ff);
    border-color: #d8b4fe;
  }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 22px; }
  .kpi {
    background: #fff; border-radius: 16px; padding: 20px 22px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    border-left: 4px solid #2563eb;
    border-top: 1px solid rgba(226,232,240,.8);
    border-right: 1px solid rgba(226,232,240,.8);
    border-bottom: 1px solid rgba(226,232,240,.8);
    position: relative; overflow: hidden;
  }
  .kpi::after {
    content: ''; position: absolute; top: -30px; right: -30px;
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, rgba(37,99,235,.1), transparent 70%);
  }
  .kpi .num { font-size: 30px; font-weight: 800; color: #0f172a; letter-spacing: -1px; line-height: 1.1; }
  .kpi .num .den { font-size: 16px; color: #64748b; font-weight: 700; }
  .kpi .lbl { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .6px; font-weight: 800; margin-top: 4px; }
  .kpi .sub-lbl { font-size: 10.5px; color: #94a3b8; font-weight: 600; margin-top: 3px; }
  .kpi.ok { border-left-color: #16a34a; }
  .kpi.ng { border-left-color: #dc2626; }

  .badge-area { background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #1e40af; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; letter-spacing: .3px; }
  .badge-area.qa { background: linear-gradient(135deg, #fae8ff, #e9d5ff); color: #7e22ce; }
  .toast {
    position: fixed; bottom: 26px; right: 26px;
    background: linear-gradient(135deg, #16a34a, #15803d); color: #fff;
    padding: 14px 22px; border-radius: 12px; font-size: 14px; font-weight: 700;
    opacity: 0; transform: translateY(12px); transition: all .3s cubic-bezier(.16,1,.3,1);
    pointer-events: none; z-index: 2000;
    box-shadow: 0 12px 30px rgba(22,163,74,.35);
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.bad { background: linear-gradient(135deg, #dc2626, #b91c1c); box-shadow: 0 12px 30px rgba(220,38,38,.35); }

  /* Matrix */
  .matrix-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid #e2e8f0; }
  table.matrix { font-size: 12px; min-width: max-content; }
  table.matrix th, table.matrix td { padding: 8px 6px; text-align: center; border-right: 1px solid #eef2f7; }
  table.matrix th { background: #f1f5f9; color: #334155; font-size: 10.5px; white-space: nowrap; position: sticky; top: 0; }
  table.matrix th.room-h, table.matrix td.room-c { text-align: left; position: sticky; left: 0; background: #fff; z-index: 2; min-width: 90px; }
  table.matrix th.param-h, table.matrix td.param-c { text-align: left; position: sticky; left: 90px; background: #fff; z-index: 2; min-width: 140px; }
  table.matrix th.shift-h, table.matrix td.shift-c { text-align: center; position: sticky; left: 230px; background: #fff; z-index: 2; min-width: 60px; border-right: 2px solid #cbd5e1; }
  table.matrix th.room-h { z-index: 3; background: #f1f5f9; }
  table.matrix th.param-h { z-index: 3; background: #f1f5f9; }
  table.matrix th.shift-h { z-index: 3; background: #f1f5f9; }
  table.matrix td.room-c { font-weight: 800; color: #0f172a; background: #f8fafc; font-size: 12px; }
  table.matrix td.param-c { font-weight: 600; color: #334155; font-size: 11.5px; }
  table.matrix td.param-c small { display: block; color: #94a3b8; font-weight: 500; font-size: 10px; }
  table.matrix td.shift-c { font-weight: 800; color: #1e40af; font-size: 11.5px; }
  table.matrix td.val { font-weight: 600; color: #0f172a; min-width: 42px; }
  table.matrix td.val.empty-cell { color: #cbd5e1; font-weight: 400; }
  table.matrix td.val.ng {
    background: #fee2e2; color: #b91c1c; font-weight: 800;
    box-shadow: inset 0 0 0 1px #fca5a5;
  }
  table.matrix td.val.ok { color: #15803d; }
  table.matrix td.val.ng:hover { background: #fecaca; }
  table.matrix td.val.ok:hover { background: #dcfce7; }
  table.matrix th.today { background: #dbeafe; color: #1e40af; }
  .matrix-legend {
    display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; font-size: 12px;
    color: #64748b; align-items: center; font-weight: 600;
  }
  .matrix-legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
  .matrix-legend .dot.ng { background: #fee2e2; border: 1px solid #fca5a5; }
  .matrix-legend .dot.ok { background: #dcfce7; border: 1px solid #86efac; }
  .matrix-legend .dot.empty { background: #f8fafc; border: 1px solid #e2e8f0; }

  /* Chart */
  .chart-section { margin-top: 22px; }
  .chart-title {
    font-size: 14px; font-weight: 800; color: #0f172a; margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .chart-sub { font-size: 11.5px; color: #94a3b8; font-weight: 600; margin-bottom: 14px; }
  .chart-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
  }
  .chart-card {
    background: linear-gradient(135deg, #ffffff, #f8fafc);

<body>

<!-- ================= LOGIN PAGE BARU ================= -->

  <div class="aurora aurora-1"></div>
  <div class="aurora aurora-2"></div>
  <div class="aurora aurora-3"></div>

  <div class="login-box">

<div class="modal-overlay hidden" id="modalOverlay">

      <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" id="modalOkBtn">OK</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= GENERATE PARTICLES ================= */
(function generateParticles() {
  const container = document.getElementById('particles');
  if (!container) return;
  const count = 30;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 15 + 's';
    p.style.animationDuration = (10 + Math.random() * 15) + 's';
    // Variasikan warna berdasarkan index
    if (i % 3 === 0) p.style.background = 'rgba(6, 182, 212, 0.8)'; // Cyan
    else if (i % 3 === 1) p.style.background = 'rgba(168, 85, 247, 0.8)'; // Purple
    p.style.width = (Math.random() * 3 + 2) + 'px';
    p.style.height = p.style.width;
    container.appendChild(p);
  }
})();

/* ================= STORAGE ================= */
const LS = { users:'me_users', rooms:'me_rooms', params:'me_params', records:'me_records', session:'me_session', seq:'me_seq' };
const memStore = {};
const storage = {
  getItem(k) { return k in memStore ? memStore[k] : null; },
  setItem(k, v) { memStore[k] = String(v); },
  removeItem(k) { delete memStore[k]; },
  clear() { for (const k in memStore) delete memStore[k]; }
};
const load = (k, d) => { try { return JSON.parse(storage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => storage.setItem(k, JSON.stringify(v));
const upper = s => String(s ?? '').toUpperCase().trim();
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTH_NAMES = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const SHIFTS = ['SHIFT 1', 'SHIFT 2', 'SHIFT 3'];
const SHIFT_COUNT = SHIFTS.length;
const DEPARTMENTS = ['QC', 'LOGISTIC', 'PRODUKSI', 'QA'];
const AREAS = ['QC', 'LOGISTIC', 'PRODUKSI', 'QA'];

const CHART_COLORS = ['#2563eb', '#06b6d4', '#16a34a', '#a855f7', '#f59e0b', '#ef4444', '#ec4899', '#0ea5e9'];

const isSuperAdmin = user => user && upper(user.dept) === 'QA';

const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const toDateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseWaktu = str => {
  try {
    const m = String(str).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (!m) return null;
    return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  } catch { return null; }
};

/* ================= DUMMY DATA GENERATOR ================= */
function rnd(min, max) { return Math.random() * (max - min) + min; }
function rndInt(min, max) { return Math.floor(rnd(min, max + 1)); }

function generateDummyRecords(rooms, params, users) {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  const daysInMonth = new Date(year, month, 0).getDate();

  const petugasByArea = {};
  users.forEach(u => {
    const d = upper(u.dept);
    if (d === 'QA') return;
    if (!petugasByArea[d]) petugasByArea[d] = [];
    petugasByArea[d].push(u);
  });

  const recs = [];
  let no = 1;

  rooms.forEach(room => {
    const rParams = params.filter(p => p.roomId === room.id);
    if (!rParams.length) return;

    const petugasArr = petugasByArea[upper(room.area)] || users.filter(u => upper(u.dept) !== 'QA');
    const petugas = petugasArr.length ? petugasArr[0] : users[0];

    for (let d = 1; d <= daysInMonth; d++) {
      SHIFTS.forEach((sh, si) => {
        if (Math.random() < 0.08) return; // ~8% slot kosong

        const values = [];
        let anyNg = false;

        rParams.forEach(p => {
          const minV = Number(p.min), maxV = Number(p.max);
          const range = maxV - minV;
          let num;
          if (Math.random() < 0.15) {
            if (Math.random() < 0.5) num = minV - range * rnd(0.02, 0.15);
            else num = maxV + range * rnd(0.02, 0.15);
          } else {
            num = minV + range * rnd(0.1, 0.9);
          }

          if (range >= 1000) num = Math.round(num);
          else if (range >= 100) num = Math.round(num * 10) / 10;
          else num = Math.round(num * 10) / 10;

          const ok = num >= minV && num <= maxV;
          if (!ok) anyNg = true;
          values.push({ nama: p.nama, satuan: p.satuan, min: p.min, max: p.max, value: num, ok });
        });

        const hh = si === 0 ? rndInt(6, 9) : si === 1 ? rndInt(14, 16) : rndInt(21, 23);
        const mm = rndInt(0, 59);
        const ss = rndInt(0, 59);
        const waktu = `${String(d).padStart(2,'0')}/${String(month).padStart(2,'0')}/${year}, ${String(hh).padStart(2,'0')}.${String(mm).padStart(2,'0')}.${String(ss).padStart(2,'0')}`;

        recs.push({
          id: genId(), no: no++, waktu, shift: sh,
          roomId: room.id, roomNomor: room.nomor, area: room.area,
          nik: petugas.nik, inisial: petugas.inisial, dept: petugas.dept,
          values, status: anyNg ? 'NG' : 'OK'
        });
      });
    }
  });

  return { records: recs, nextNo: no };
}

/* ================= SEED ================= */
function seed(force) {
  const marker = 'me_seed_v14_anim_login';
  if (!force && storage.getItem(marker)) return;
  [LS.users, LS.rooms, LS.params, LS.records, LS.seq, LS.session].forEach(k => storage.removeItem(k));

  const users = [
    { id: genId(), nik: '1001', inisial: 'ADM', dept: 'QC' },
    { id: genId(), nik: '1002', inisial: 'LOG', dept: 'LOGISTIC' },
    { id: genId(), nik: '1003', inisial: 'PRD', dept: 'PRODUKSI' },
    { id: genId(), nik: '1004', inisial: 'QA',  dept: 'QA' }
  ];
  save(LS.users, users);

  const roomQC1 = genId(), roomQC2 = genId(), roomLOG = genId(), roomPRD1 = genId(), roomPRD2 = genId();
  const rooms = [
    { id: roomQC1, nomor: 'R-101', area: 'QC' },
    { id: roomQC2, nomor: 'R-102', area: 'QC' },
    { id: roomLOG, nomor: 'R-201', area: 'LOGISTIC' },
    { id: roomPRD1, nomor: 'R-301', area: 'PRODUKSI' },
    { id: roomPRD2, nomor: 'R-302', area: 'PRODUKSI' }
  ];
  save(LS.rooms, rooms);

  const params = [
    { id: genId(), roomId: roomQC1, nama: 'SUHU', satuan: '°C', min: 18, max: 26 },
    { id: genId(), roomId: roomQC1, nama: 'KELEMBAPAN', satuan: '%', min: 40, max: 60 },
    { id: genId(), roomId: roomQC2, nama: 'SUHU', satuan: '°C', min: 20, max: 25 },
    { id: genId(), roomId: roomLOG, nama: 'SUHU', satuan: '°C', min: 15, max: 30 },
    { id: genId(), roomId: roomLOG, nama: 'KELEMBAPAN', satuan: '%', min: 30, max: 70 },
    { id: genId(), roomId: roomPRD1, nama: 'SUHU', satuan: '°C', min: 20, max: 28 },
    { id: genId(), roomId: roomPRD1, nama: 'TEKANAN UDARA', satuan: 'PA', min: 100000, max: 102000 },
    { id: genId(), roomId: roomPRD2, nama: 'SUHU', satuan: '°C', min: 22, max: 30 }
  ];
  save(LS.params, params);

  const { records, nextNo } = generateDummyRecords(rooms, params, users);
  save(LS.records, records);
  save(LS.seq, { no: nextNo });
  storage.setItem(marker, '1');
}
seed(false);

function resetAll() {
  showConfirm('Reset Data', 'Hapus semua data dan reset ke default (dengan dummy baru)?', () => {
    storage.clear(); seed(true); location.reload();
  });
}

const getUsers = () => load(LS.users, []);
const getRooms = () => load(LS.rooms, []);
const getParams = () => load(LS.params, []);
const getParamsByRoom = roomId => getParams().filter(p => p.roomId === roomId);
const getRecords = () => load(LS.records, []);

function isSlotFilled(roomId, shift, dateKey) {
  return getRecords().some(r => {
    const d = parseWaktu(r.waktu);
    if (!d) return false;
    return r.roomId === roomId && r.shift === shift && toDateKey(d) === dateKey;
  });
}
function getSlotRecord(roomId, shift, dateKey) {
  return getRecords().find(r => {
    const d = parseWaktu(r.waktu);
    if (!d) return false;
    return r.roomId === roomId && r.shift === shift && toDateKey(d) === dateKey;
  });
}

/* ================= MODAL ================= */
let modalOkHandler = null;
function openModal({ title, subtitle, icon, bodyHTML, okText, okClass, wide, onOk, okDisabled }) {
  document.getElementById('modalHead').innerHTML =
    `<div class="ico">${icon || '⚙️'}</div>
     <div><div>${esc(title)}</div>${subtitle ? `<div class="h-sub">${esc(subtitle)}</div>` : ''}</div>`;
  document.getElementById('modalBody').innerHTML = bodyHTML;
  document.getElementById('modalMsg').textContent = '';
  document.getElementById('modalBox').classList.toggle('wide', !!wide);
  const okBtn = document.getElementById('modalOkBtn');
  okBtn.textContent = okText || 'OK';
  okBtn.className = 'btn ' + (okClass || 'btn-primary');
  okBtn.disabled = !!okDisabled;
  okBtn.style.opacity = okDisabled ? '.5' : '1';
  okBtn.style.cursor = okDisabled ? 'not-allowed' : 'pointer';
  modalOkHandler = onOk;
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
  modalOkHandler = null;
}
function modalError(msg) { document.getElementById('modalMsg').textContent = msg; }
document.getElementById('modalOkBtn').addEventListener('click', () => {
  if (document.getElementById('modalOkBtn').disabled) return;
  if (modalOkHandler) modalOkHandler();
});

function showConfirm(title, message, onYes) {
  openModal({
    title, subtitle: 'Konfirmasi', icon: '⚠️',
    bodyHTML: `<p style="font-size:14px;color:#334155;line-height:1.6">${esc(message)}</p>`,
    okText: 'Ya, Lanjutkan', okClass: 'btn-danger',
    onOk: () => { closeModal(); onYes(); }
  });
}
function mField(label, id, value, opts = {}) {
  const t = opts.type || 'text';
  const list = opts.list ? ` list="${opts.list}"` : '';
  return `<div class="field"><label>${esc(label)}</label>
    <input type="${t}" id="${id}" value="${esc(value)}"${list} ${opts.step ? `step="${opts.step}"` : ''} ${opts.uppercase ? 'style="text-transform:uppercase"' : ''}>
  </div>`;
}

/* ================= SESSION ================= */
let session = null;
function doLogin() {
  const nik = upper(document.getElementById('loginNik').value);
  const err = document.getElementById('loginErr');
  if (!nik) { err.textContent = 'NIK wajib diisi'; return; }
  const user = getUsers().find(u => upper(u.nik) === nik);
  if (!user) { err.textContent = 'NIK tidak terdaftar. Coba 1001 / 1002 / 1003 / 1004.'; return; }
  session = user; save(LS.session, user);
  err.textContent = ''; enterApp();
}
function doLogout() {
  session = null; storage.removeItem(LS.session);
  document.getElementById('appPage').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('loginNik').value = '';
}
function enterApp() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');
  document.getElementById('userLabel').textContent = `${session.inisial} (${session.nik})`;
  const deptBadge = document.getElementById('userDept');
  deptBadge.textContent = session.dept;
  deptBadge.className = 'badge' + (isSuperAdmin(session) ? ' super' : '');

  const mgmtBtn = document.getElementById('tabBtnManagement');
  mgmtBtn.classList.toggle('hidden', !isSuperAdmin(session));

  switchTab('dashboard');
}

/* ================= TABS ================= */
function switchTab(tab) {
  if (tab === 'management' && !isSuperAdmin(session)) tab = 'dashboard';

  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  ['dashboard', 'input', 'management'].forEach(t => document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab));
  if (tab === 'dashboard') renderDashboard();
  if (tab === 'input') renderInput();
  if (tab === 'management') renderManagement();
}
function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (bad ? ' bad' : '');
  setTimeout(() => t.className = 'toast', 2200);
}

/* ================= DASHBOARD ================= */
function renderDashboard() {
  const superAdmin = isSuperAdmin(session);
  const myDept = upper(session.dept);
  const recs = getRecords();
  const now = new Date();
  if (!window.__dashMonth) window.__dashMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  const [yStr, mStr] = window.__dashMonth.split('-');
  const year = Number(yStr), month = Number(mStr);
  const daysInMonth = new Date(year, month, 0).getDate();
  const isCurrentMonth = (now.getFullYear() === year && now.getMonth() + 1 === month);

  const roomsInScope = superAdmin
    ? getRooms()
    : getRooms().filter(r => upper(r.area) === myDept);

  const totalParamCount = roomsInScope.reduce((sum, r) => sum + getParamsByRoom(r.id).length, 0);
  const targetTotal = totalParamCount * SHIFT_COUNT * daysInMonth;

  const monthRecs = recs.filter(r => {
    const d = parseWaktu(r.waktu);
    if (!d) return false;
    if (d.getFullYear() !== year || (d.getMonth() + 1) !== month) return false;
    if (!superAdmin && upper(r.area) !== myDept) return false;
    return true;
  });

  const filledCount = monthRecs.length;
  const okCount = monthRecs.filter(r => r.status === 'OK').length;
  const ngCount = filledCount - okCount;
  const pct = targetTotal > 0 ? Math.round((filledCount / targetTotal) * 100) : 0;

  const rooms = roomsInScope;
  const params = getParams();

  const cellMap = {};
  const chartData = {};

  monthRecs.forEach(rec => {
    const d = parseWaktu(rec.waktu);
    if (!d) return;
    const dateNum = d.getDate();
    const shift = rec.shift || 'SHIFT 1';
    const roomParams = params.filter(p => p.roomId === rec.roomId);
    rec.values.forEach(v => {
      const p = roomParams.find(x => x.nama === v.nama);
      if (!p) return;
      cellMap[`${rec.roomId}|${p.id}|${shift}|${dateNum}`] = v;

      const ck = `${rec.roomId}|${p.id}`;
      if (!chartData[ck]) chartData[ck] = { room: getRooms().find(rr => rr.id === rec.roomId), param: p, values: {} };
      if (!chartData[ck].values[dateNum]) chartData[ck].values[dateNum] = { sum: 0, count: 0 };
      chartData[ck].values[dateNum].sum += Number(v.value);
      chartData[ck].values[dateNum].count += 1;
    });
  });

  const monthOpts = buildMonthOptions(year, month);
  const scopeLabel = superAdmin ? 'Semua Area' : `Area ${myDept}`;

  let html = `<h2 class="page-title">📊 Dashboard Monitoring
    <span class="sub">— ${MONTH_NAMES[month-1]} ${year}</span>
  </h2>
  <div class="filter-bar">
    <div class="field"><label>Bulan</label>
      <select onchange="window.__dashMonth=this.value;renderDashboard()">${monthOpts}</select>
    </div>
    <div class="dept-info ${superAdmin ? 'super' : ''}">
      ${superAdmin ? '👑 Super Admin — Semua Area' : '🏷️ Area terkunci: ' + esc(myDept)}
    </div>
    ${superAdmin ? `<button class="btn btn-export" onclick="exportExcel()">⬇️ Export Data (Excel)</button>` : ''}
  </div>

  <div class="kpi-row">
    <div class="kpi">
      <div class="num">${filledCount} <span class="den">/ ${targetTotal}</span></div>
      <div class="lbl">Total Pemantauan</div>
      <div class="sub-lbl">${pct}% · ${totalParamCount} parameter × ${SHIFT_COUNT} shift × ${daysInMonth} hari · ${esc(scopeLabel)}</div>
    </div>
    <div class="kpi ok"><div class="num">${okCount}</div><div class="lbl">Status OK</div><div class="sub-lbl">dari ${filledCount} terisi</div></div>
    <div class="kpi ng"><div class="num">${ngCount}</div><div class="lbl">Status NG</div><div class="sub-lbl">di luar standar</div></div>
  </div>`;

  html += `<div class="card" style="padding:18px 18px 14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div style="font-size:14px;font-weight:800;color:#0f172a">Matriks Pemantauan Harian (per Shift) — ${esc(scopeLabel)}</div>
      <div class="matrix-legend">
        <span><span class="dot ng"></span>Di luar standar</span>
        <span><span class="dot ok"></span>Memenuhi standar</span>
        <span><span class="dot empty"></span>Belum diisi</span>
      </div>
    </div>`;

  const rows = [];
  rooms.forEach(room => {
    const rParams = params.filter(p => p.roomId === room.id);
    if (!rParams.length) {
      rows.push({ room, param: null, shift: null });
    } else {
      rParams.forEach(p => {
        SHIFTS.forEach(sh => rows.push({ room, param: p, shift: sh }));
      });
    }
  });

  if (!rooms.length) {
    html += `<div class="empty">Belum ada ruangan${superAdmin ? '' : ' untuk area ' + esc(myDept)}. Hubungi admin.</div>`;
  } else if (!rows.length) {
    html += `<div class="empty">Belum ada parameter${superAdmin ? '' : ' untuk ruangan area ' + esc(myDept)}.</div>`;
  } else {
    html += `<div class="matrix-wrap"><table class="matrix">
      <thead><tr>
        <th class="room-h">Ruangan</th>
        <th class="param-h">Parameter</th>
        <th class="shift-h">Shift</th>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = isCurrentMonth && d === now.getDate();
      html += `<th class="${isToday ? 'today' : ''}">${String(d).padStart(2,'0')}</th>`;
    }
    html += `</tr></thead><tbody>`;

    let prevRoomId = null, prevParamId = null;
    rows.forEach(({ room, param, shift }) => {
      html += `<tr>`;
      if (room.id !== prevRoomId) {
        const rParams = params.filter(p => p.roomId === room.id);
        const rpCount = rParams.length || 1;
        const span = rpCount * SHIFTS.length;
        html += `<td class="room-c" rowspan="${span}">${esc(room.nomor)}<br><small style="font-weight:600;color:#64748b;font-size:10px">${esc(room.area)}</small></td>`;
        prevRoomId = room.id;
        prevParamId = null;
      }
      if (param) {
        if (param.id !== prevParamId) {
          html += `<td class="param-c" rowspan="${SHIFTS.length}">${esc(param.nama)}<small>${esc(param.min)}–${esc(param.max)} ${esc(param.satuan)}</small></td>`;
          prevParamId = param.id;
        }
        html += `<td class="shift-c">${esc(shift)}</td>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const key = `${room.id}|${param.id}|${shift}|${d}`;
          const cell = cellMap[key];
          const isToday = isCurrentMonth && d === now.getDate();
          if (!cell) {
            html += `<td class="val empty-cell${isToday ? ' today' : ''}">–</td>`;
          } else {
            const cls = cell.ok ? 'ok' : 'ng';
            html += `<td class="val ${cls}${isToday ? ' today' : ''}" title="${esc(param.nama)} · ${esc(shift)}: ${esc(cell.value)} ${esc(cell.satuan)}">${esc(cell.value)}</td>`;
          }
        }
      } else {
        html += `<td class="param-c" style="color:#94a3b8;font-style:italic">Belum ada parameter</td>`;
        html += `<td class="shift-c">–</td>`;
        for (let d = 1; d <= daysInMonth; d++) html += `<td class="val empty-cell">–</td>`;
      }
      html += `</tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;

  /* CHART */
  html += `<div class="card chart-section">
    <div class="chart-title">📈 Grafik Rata-rata Harian per Parameter</div>
    <div class="chart-sub">Sumbu X = tanggal ${MONTH_NAMES[month-1]} ${year}. Nilai = rata-rata semua shift pada tanggal tersebut. Area hijau = rentang standar.</div>
    <div class="chart-grid">`;

  const chartKeys = Object.keys(chartData);
  if (!chartKeys.length) {
    html += `<div class="empty" style="grid-column: 1/-1">Belum ada data untuk grafik di bulan ini.</div>`;
  } else {
    chartKeys.forEach((ck, idx) => {
      const cd = chartData[ck];
      if (!cd || !cd.room || !cd.param) return;
      const color = CHART_COLORS[idx % CHART_COLORS.length];
      html += `<div class="chart-card">
        <div class="head">
          <div class="left">
            <div class="pname">${esc(cd.param.nama)}</div>
            <div class="proom">${esc(cd.room.nomor)} · ${esc(cd.room.area)}</div>
          </div>
          <div class="std">${esc(cd.param.min)}–${esc(cd.param.max)} ${esc(cd.param.satuan)}</div>
        </div>
        ${renderLineChart(cd.values, daysInMonth, cd.param, color)}
      </div>`;
    });
  }

  html += `</div></div>`;

  document.getElementById('tab-dashboard').innerHTML = html;
}

function renderLineChart(valuesByDay, daysInMonth, param, color) {
  const W = 360, H = 160;
  const padL = 34, padR = 10, padT = 12, padB = 22;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;

  const pts = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const v = valuesByDay[d];
    if (v && v.count > 0) pts.push({ day: d, val: v.sum / v.count });
  }

  const minStd = Number(param.min), maxStd = Number(param.max);
  let minY = minStd, maxY = maxStd;
  pts.forEach(p => { if (p.val < minY) minY = p.val; if (p.val > maxY) maxY = p.val; });
  if (minY === maxY) { minY -= 1; maxY += 1; }
  const padY = (maxY - minY) * 0.1;
  minY -= padY; maxY += padY;

  const x = day => padL + ((day - 1) / (daysInMonth - 1 || 1)) * chartW;
  const y = val => padT + chartH - ((val - minY) / (maxY - minY)) * chartH;

  let grid = '';
  const gridN = 4;
  for (let i = 0; i <= gridN; i++) {
    const yy = padT + (chartH / gridN) * i;
    const val = maxY - ((maxY - minY) / gridN) * i;
    grid += `<line x1="${padL}" y1="${yy}" x2="${padL+chartW}" y2="${yy}" stroke="#eef2f7" stroke-width="1"/>`;
    grid += `<text x="${padL - 4}" y="${yy + 3}" text-anchor="end" font-size="8" fill="#94a3b8" font-weight="600">${val.toFixed(val >= 1000 ? 0 : 1)}</text>`;
  }

  const stdY1 = y(maxStd), stdY2 = y(minStd);
  const stdRect = `<rect x="${padL}" y="${stdY1}" width="${chartW}" height="${Math.max(0, stdY2 - stdY1)}" fill="#dcfce7" opacity="0.6"/>`;
  const stdLine1 = `<line x1="${padL}" y1="${stdY1}" x2="${padL+chartW}" y2="${stdY1}" stroke="#86efac" stroke-width="1" stroke-dasharray="3 3"/>`;
  const stdLine2 = `<line x1="${padL}" y1="${stdY2}" x2="${padL+chartW}" y2="${stdY2}" stroke="#86efac" stroke-width="1" stroke-dasharray="3 3"/>`;

  let path = '', dots = '';
  pts.forEach((p, i) => {
    const cx = x(p.day), cy = y(p.val);
    if (i === 0) path += `M ${cx} ${cy}`;
    else path += ` L ${cx} ${cy}`;
    const outOfStd = p.val < minStd || p.val > maxStd;
    const fill = outOfStd ? '#dc2626' : color;
    dots += `<circle cx="${cx}" cy="${cy}" r="3" fill="${fill}" stroke="#fff" stroke-width="1.5"/>`;
  });

  let xTicks = '';
  for (let d = 1; d <= daysInMonth; d++) {
    if (d === 1 || d === daysInMonth || d % 5 === 0) {
      const xx = x(d);
      xTicks += `<text x="${xx}" y="${H - 6}" text-anchor="middle" font-size="8" fill="#94a3b8" font-weight="600">${d}</text>`;
    }
  }

  const areaPath = pts.length > 1
    ? `<path d="${path} L ${x(pts[pts.length-1].day)} ${padT+chartH} L ${x(pts[0].day)} ${padT+chartH} Z" fill="${color}" opacity="0.08"/>`
    : '';

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${stdRect}${grid}${stdLine1}${stdLine2}${areaPath}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xTicks}
  </svg>`;
}

function buildMonthOptions(selYear, selMonth) {
  const now = new Date(); const opts = [];
  for (let i = 11; i >= -1; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const y = d.getFullYear(), m = d.getMonth() + 1;
    const val = `${y}-${String(m).padStart(2,'0')}`;
    const sel = (y === selYear && m === selMonth) ? 'selected' : '';
    opts.push(`<option value="${val}" ${sel}>${MONTH_NAMES[m-1]} ${y}</option>`);
  }
  return opts.join('');
}

/* ================= EXPORT EXCEL (XML Spreadsheet 2003) ================= */
function exportExcel() {
  if (!isSuperAdmin(session)) return;
  const [yStr, mStr] = (window.__dashMonth || '').split('-');
  const year = Number(yStr), month = Number(mStr);
  const recs = getRecords().filter(r => {
    const d = parseWaktu(r.waktu);
    return d && d.getFullYear() === year && (d.getMonth() + 1) === month;
  });

  if (!recs.length) return toast('Tidak ada data untuk diekspor di bulan ini', true);

  const header = ['No','Tanggal','Waktu','Shift','Ruangan','Area','NIK','Petugas','Departemen','Parameter','Nilai','Satuan','Min','Max','Status'];
  
  let xml = `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
 <Styles>
  <Style ss:ID="Default" ss:Name="Normal">
   <Alignment ss:Vertical="Bottom"/>
   <Borders/>
   <Font ss:FontName="Calibri" x:Family="Swiss" ss:Size="11" ss:Color="#000000"/>
   <Interior/>
   <NumberFormat/>
   <Protection/>
  </Style>
  <Style ss:ID="header">
   <Font ss:FontName="Calibri" x:Family="Swiss" ss:Size="11" ss:Bold="1" ss:Color="#FFFFFF"/>
   <Interior ss:Color="#2563EB" ss:Pattern="Solid"/>
  </Style>
 </Styles>
 <Worksheet ss:Name="Pemantauan">
  <Table>
   <Row>`;
  
  header.forEach(h => {
    xml += `<Cell ss:StyleID="header"><Data ss:Type="String">${esc(h)}</Data></Cell>`;
  });
  xml += `</Row>`;

  recs.slice().sort((a, b) => a.no - b.no).forEach(r => {
    const d = parseWaktu(r.waktu);
    const tgl = d ? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}` : '';
    r.values.forEach(v => {
      const row = [r.no, tgl, r.waktu||'', r.shift||'', r.roomNomor, r.area, r.nik, r.inisial, r.dept, v.nama, v.value, v.satuan, v.min, v.max, v.ok?'OK':'NG'];
      xml += `<Row>`;
      row.forEach(c => {
        const isNum = typeof c === 'number';
        xml += `<Cell><Data ss:Type="${isNum ? 'Number' : 'String'}">${esc(c)}</Data></Cell>`;
      });
      xml += `</Row>`;
    });
  });

  xml += `  </Table>
 </Worksheet>
</Workbook>`;

  const blob = new Blob([xml], { type: 'application/vnd.ms-excel' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const fname = `monitoring-environment_${year}-${String(month).padStart(2,'0')}.xls`;
  a.download = fname;
  a.style.display = 'none';
  document.body.appendChild(a);
  try {
    a.click();
    toast(`Export ${recs.length} pemantauan → ${fname}`);
  } catch (e) {
    toast('Download diblok sandbox', true);
    console.log('XML Excel:\n', xml);
  }
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

/* ================= INPUT ================= */
function renderInput() {
  const superAdmin = isSuperAdmin(session);
  const myDept = upper(session.dept);
  const rooms = superAdmin ? getRooms() : getRooms().filter(r => upper(r.area) === myDept);
  const tk = todayKey();
  const titleArea = superAdmin ? 'Semua Area (QA)' : `Area ${myDept}`;

  let html = `<h2 class="page-title">✍️ Input Pemantauan <span class="sub">— ${esc(titleArea)} · ${new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})}</span></h2>`;

  if (!rooms.length) {
    html += `<div class="card"><div class="empty">Belum ada ruangan untuk area ${esc(titleArea)}.</div></div>`;
    document.getElementById('tab-input').innerHTML = html;
    return;
  }
  html += `<div class="card">`;

  const byArea = {};
  rooms.forEach(r => { const a = r.area; if (!byArea[a]) byArea[a] = []; byArea[a].push(r); });

  Object.keys(byArea).forEach(area => {
    html += `<div class="area-group"><h3>Area ${esc(area)}</h3><div class="scorecards">`;
    byArea[area].forEach(r => {
      const pcount = getParamsByRoom(r.id).length;
      const shiftStatus = SHIFTS.map(sh => {
        const rec = getSlotRecord(r.id, sh, tk);
        return { shift: sh, filled: !!rec, ng: rec ? rec.status === 'NG' : false };
      });
      const filledCount = shiftStatus.filter(s => s.filled).length;
      const isFull = filledCount === SHIFTS.length;
      html += `<div class="scorecard ${isFull ? 'full' : ''}" onclick="openInputForm('${r.id}')">
        <div class="room">${esc(r.nomor)}</div>
        <div class="sub">${esc(r.area)}</div>
        <div class="pcount">${pcount} parameter · ${filledCount}/3 shift terisi</div>
        <div class="shift-status">
          ${shiftStatus.map(s => `<div class="shift-chip ${s.filled ? 'filled' : ''} ${s.ng ? 'ng' : ''}">
            ${s.shift.split(' ')[1]}${s.filled ? ' ✓' : ''}
          </div>`).join('')}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;
  document.getElementById('tab-input').innerHTML = html;
}

let currentShift = 'SHIFT 1';
let currentRoomId = null;

function openInputForm(roomId) {
  const room = getRooms().find(r => r.id === roomId);
  if (!room) return;
  const params = getParamsByRoom(roomId);
  const tk = todayKey();

  if (!params.length) {
    openModal({
      title: `Ruangan ${room.nomor}`, subtitle: 'Belum ada parameter', icon: '⚠️',
      bodyHTML: `<p style="font-size:14px;color:#334155;line-height:1.6">Ruangan ini belum punya parameter. Tambahkan dulu di <b>Management</b>.</p>`,
      okText: 'Mengerti', onOk: () => closeModal()
    });
    return;
  }

  const allFilled = SHIFTS.every(sh => isSlotFilled(roomId, sh, tk));
  if (allFilled) {
    openModal({
      title: `Ruangan ${room.nomor}`, subtitle: 'Sudah lengkap', icon: '🔒',
      bodyHTML: `<div class="already-note">🔒 Semua shift (1, 2, 3) untuk ruangan ini <b>sudah diisi</b> hari ini. Input baru akan tersedia besok.</div>`,
      okText: 'Mengerti', onOk: () => closeModal()
    });
    return;
  }

  currentShift = SHIFTS.find(sh => !isSlotFilled(roomId, sh, tk)) || 'SHIFT 1';
  currentRoomId = roomId;

  renderInputPopup();

  params.forEach(p => {
    const input = document.getElementById('val-' + p.id);
    if (!input) return;
    input.addEventListener('input', () => {
      const row = document.getElementById('row-' + p.id);
      const v = input.value.trim();
      if (v === '') { row.classList.remove('invalid'); return; }
      const num = Number(v);
      if (Number.isNaN(num)) { row.classList.add('invalid'); return; }
      row.classList.toggle('invalid', !(num >= Number(p.min) && num <= Number(p.max)));
    });
  });
}

function renderInputPopup() {
  const room = getRooms().find(r => r.id === currentRoomId);
  const params = getParamsByRoom(currentRoomId);
  const tk = todayKey();

  const shiftPicker = `<div class="field" style="gap:8px">
    <label>Pilih Shift</label>
    <div class="shift-picker" id="shiftPicker">
      ${SHIFTS.map(sh => {
        const filled = isSlotFilled(currentRoomId, sh, tk);
        const cls = 'shift-opt' + (sh === currentShift ? ' active' : '') + (filled ? ' disabled' : '');
        return `<div class="${cls}" data-shift="${sh}" ${filled ? '' : `onclick="pickShift('${sh}')"`}>
          <span class="big">${sh.split(' ')[1]}</span>${sh}
        </div>`;
      }).join('')}
    </div>
  </div>`;

  const paramsHTML = params.map(p => `
    <div class="param-input-row" id="row-${p.id}">
      <div class="pinfo">
        <b>${esc(p.nama)}</b> <span style="color:#64748b">(${esc(p.satuan)})</span>
        <span class="std">Standar: ${esc(p.min)} – ${esc(p.max)} ${esc(p.satuan)}</span>
      </div>
      <input type="number" step="any" id="val-${p.id}" placeholder="0" inputmode="decimal">
    </div>
  `).join('');

  openModal({
    title: `Form Pemantauan — ${room.nomor}`,
    subtitle: `Area ${room.area} · ${params.length} parameter`,
    icon: '📝', wide: true,
    bodyHTML: shiftPicker + `<div style="height:4px"></div>` + paramsHTML,
    okText: 'Submit Pemantauan',
    onOk: () => submitInput()
  });
}

function pickShift(sh) {
  if (isSlotFilled(currentRoomId, sh, todayKey())) return toast(`${sh} sudah diisi hari ini`, true);
  currentShift = sh;
  document.querySelectorAll('.shift-opt').forEach(el => {
    el.classList.toggle('active', el.dataset.shift === sh);
  });
}

function submitInput() {
  const room = getRooms().find(r => r.id === currentRoomId);
  const params = getParamsByRoom(currentRoomId);
  const tk = todayKey();

  if (isSlotFilled(currentRoomId, currentShift, tk)) {
    modalError(`Shift ini sudah diisi untuk ruangan ${room.nomor} hari ini. Pilih shift lain.`);
    return;
  }

  const values = [];
  let allFilled = true, invalid = false, anyNg = false;

  for (const p of params) {
    const el = document.getElementById('val-' + p.id);
    const raw = el ? el.value.trim() : '';
    if (raw === '') { allFilled = false; continue; }
    const num = Number(raw);
    if (Number.isNaN(num)) { invalid = true; continue; }
    const ok = num >= Number(p.min) && num <= Number(p.max);
    if (!ok) anyNg = true;
    values.push({ nama: p.nama, satuan: p.satuan, min: p.min, max: p.max, value: num, ok });
  }

  if (!allFilled || invalid || !values.length) {
    modalError('Semua parameter wajib diisi dengan angka valid.');
    return;
  }

  const seq = load(LS.seq, { no: 1 });
  const recs = getRecords();
  recs.push({
    id: genId(), no: seq.no,
    waktu: new Date().toLocaleString('id-ID'),
    shift: currentShift,
    roomId: room.id, roomNomor: room.nomor, area: room.area,
    nik: session.nik, inisial: session.inisial, dept: session.dept,
    values, status: anyNg ? 'NG' : 'OK'
  });
  save(LS.records, recs);
  save(LS.seq, { no: seq.no + 1 });

  closeModal();
  toast(`✓ ${currentShift} · ${room.nomor} tersimpan`);

  const remaining = SHIFTS.filter(sh => !isSlotFilled(room.id, sh, tk));
  if (remaining.length) {
    setTimeout(() => {
      openModal({
        title: 'Shift tersimpan ✓', subtitle: `${room.nomor} · ${currentShift}`, icon: '✅',
        bodyHTML: `<p style="font-size:14px;color:#334155;line-height:1.6">Data shift ini berhasil disimpan.<br><br>Masih ada shift yang belum diisi: <b>${remaining.join(', ')}</b>.<br>Mau isi shift berikutnya sekarang?</p>`,
        okText: `Isi ${remaining[0]}`,
        onOk: () => {
          closeModal();
          currentShift = remaining[0];
          currentRoomId = room.id;
          openInputForm(room.id);
        }
      });
      const cancelBtn = document.querySelector('.modal-foot .btn-secondary');
      if (cancelBtn) {
        cancelBtn.textContent = 'Nanti';
        cancelBtn.onclick = () => { closeModal(); renderInput(); };
      }
    }, 400);
  } else {
    renderInput();
  }
}

/* ================= MANAGEMENT ================= */
let openRoomId = null;

function renderManagement() {
  if (!isSuperAdmin(session)) {
    document.getElementById('tab-management').innerHTML =
      `<div class="card"><div class="empty">Halaman Management hanya untuk user QA.</div></div>`;
    return;
  }

  const users = getUsers();
  const rooms = getRooms();
  const params = getParams();

  let html = `<h2 class="page-title">⚙️ Management <span class="sub">— Super Admin (QA)</span></h2>`;

  html += `<div class="card">
    <h3 style="font-size:15px;margin-bottom:14px;font-weight:800">👥 Manajemen User</h3>
    <div class="form-row">
      <div class="field"><label>NIK</label><input id="u-nik" placeholder="NIK" style="text-transform:uppercase"></div>
      <div class="field"><label>Inisial</label><input id="u-inisial" placeholder="INISIAL" style="text-transform:uppercase"></div>
      <div class="field"><label>Departemen</label>
        <select id="u-dept">${DEPARTMENTS.map(d => `<option>${d}</option>`).join('')}</select>
      </div>
      <div class="field" style="flex:0"><button class="btn btn-primary" onclick="addUser()">+ Tambah User</button></div>
    </div>
    <table><thead><tr><th>NIK</th><th>Inisial</th><th>Departemen</th><th>Aksi</th></tr></thead><tbody>`;
  if (!users.length) html += `<tr><td colspan="4" class="empty">Belum ada user</td></tr>`;
  users.forEach(u => {
    const isQA = upper(u.dept) === 'QA';
    html += `<tr>
      <td><b>${esc(u.nik)}</b></td><td>${esc(u.inisial)}</td>
      <td><span class="badge-area ${isQA ? 'qa' : ''}">${esc(u.dept)}</span></td>
      <td><button class="btn btn-edit btn-sm" onclick="editUser('${u.id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="delUser('${u.id}')">Delete</button></td></tr>`;
  });
  html += `</tbody></table></div>`;

  html += `<div class="card">
    <h3 style="font-size:15px;margin-bottom:14px;font-weight:800">🏢 Manajemen Ruangan & Parameter</h3>
    <div class="form-row">
      <div class="field"><label>Nomor Ruangan</label><input id="r-nomor" placeholder="R-XXX" style="text-transform:uppercase"></div>
      <div class="field"><label>Area</label>
        <select id="r-area">${AREAS.map(a => `<option>${a}</option>`).join('')}</select>
      </div>
      <div class="field" style="flex:0"><button class="btn btn-primary" onclick="addRoom()">+ Tambah Ruangan</button></div>
    </div>
    <div style="margin-top:16px">`;
  if (!rooms.length) {
    html += `<div class="empty">Belum ada ruangan.</div>`;
  } else {
    rooms.forEach(r => {
      const rParams = params.filter(p => p.roomId === r.id);
      const isOpen = openRoomId === r.id;
      const isQAroom = upper(r.area) === 'QA';
      html += `<div class="room-block">
        <div class="room-head" onclick="toggleRoomPanel('${r.id}')">
          <div class="left">
            <span class="chev ${isOpen ? 'open' : ''}">▶</span>
            <b>${esc(r.nomor)}</b>
            <span class="badge-area ${isQAroom ? 'qa' : ''}">${esc(r.area)}</span>
            <span style="font-size:12px;color:#64748b;font-weight:600">${rParams.length} parameter</span>
          </div>
          <div class="right" onclick="event.stopPropagation()">
            <button class="btn btn-edit btn-sm" onclick="editRoom('${r.id}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="delRoom('${r.id}')">Delete</button>
          </div>
        </div>
        <div class="room-body ${isOpen ? '' : 'hidden'}">
          <h4>Parameter Ruangan ${esc(r.nomor)}</h4>
          <div class="form-row">
            <div class="field"><label>Nama</label><input id="p-nama-${r.id}" placeholder="NAMA" style="text-transform:uppercase"></div>
            <div class="field"><label>Satuan</label>
              <input id="p-satuan-${r.id}" list="satuanList-${r.id}" placeholder="SATUAN">
              <datalist id="satuanList-${r.id}"><option value="°C"><option value="%"><option value="PA"></datalist>
            </div>
            <div class="field" style="max-width:110px"><label>Min</label><input type="number" step="any" id="p-min-${r.id}" placeholder="0"></div>
            <div class="field" style="max-width:110px"><label>Max</label><input type="number" step="any" id="p-max-${r.id}" placeholder="0"></div>
            <div class="field" style="flex:0"><button class="btn btn-primary" onclick="addParam('${r.id}')">+ Tambah</button></div>
          </div>
          <table style="margin-top:12px"><thead><tr><th>Nama</th><th>Satuan</th><th>Min</th><th>Max</th><th>Syarat</th><th>Aksi</th></tr></thead><tbody>`;
      if (!rParams.length) html += `<tr><td colspan="6" class="empty">Belum ada parameter</td></tr>`;
      rParams.forEach(p => {
        html += `<tr>
          <td><b>${esc(p.nama)}</b></td><td>${esc(p.satuan)}</td><td>${esc(p.min)}</td><td>${esc(p.max)}</td>
          <td>${esc(p.min)} – ${esc(p.max)} ${esc(p.satuan)}</td>
          <td><button class="btn btn-edit btn-sm" onclick="editParam('${p.id}')">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="delParam('${p.id}')">Delete</button></td></tr>`;
      });
      html += `</tbody></table></div></div>`;
    });
  }
  html += `</div></div>`;
  document.getElementById('tab-management').innerHTML = html;
}

function toggleRoomPanel(roomId) {
  openRoomId = openRoomId === roomId ? null : roomId;
  renderManagement();
}

function addUser() {
  const nik = upper(document.getElementById('u-nik').value);
  const inisial = upper(document.getElementById('u-inisial').value);
  const dept = upper(document.getElementById('u-dept').value);
  if (!nik || !inisial) return toast('NIK dan Inisial wajib diisi', true);
  if (!DEPARTMENTS.includes(dept)) return toast('Departemen tidak valid', true);
  const users = getUsers();
  if (users.some(u => upper(u.nik) === nik)) return toast('NIK sudah terdaftar', true);
  users.push({ id: genId(), nik, inisial, dept });
  save(LS.users, users); toast('User ditambahkan'); renderManagement();
}
function editUser(id) {
  const users = getUsers();
  const u = users.find(x => x.id === id); if (!u) return;
  openModal({
    title: 'Edit User', icon: '👤',
    bodyHTML: mField('NIK', 'm-u-nik', u.nik, { uppercase: true })
      + mField('Inisial', 'm-u-inisial', u.inisial, { uppercase: true })
      + `<div class="field"><label>Departemen</label>
          <select id="m-u-dept">${DEPARTMENTS.map(d => `<option ${d===u.dept?'selected':''}>${d}</option>`).join('')}</select></div>`,
    okText: 'Simpan',
    onOk: () => {
      const nik = upper(document.getElementById('m-u-nik').value);
      const inisial = upper(document.getElementById('m-u-inisial').value);
      const dept = upper(document.getElementById('m-u-dept').value);
      if (!nik) return modalError('NIK tidak boleh kosong');
      if (!inisial) return modalError('Inisial tidak boleh kosong');
      if (!DEPARTMENTS.includes(dept)) return modalError('Departemen tidak valid');
      if (users.some(x => x.id !== id && upper(x.nik) === nik)) return modalError('NIK sudah dipakai user lain');
      u.nik = nik; u.inisial = inisial; u.dept = dept;
      save(LS.users, users); closeModal(); toast('User diperbarui'); renderManagement();
    }
  });
}
function delUser(id) {
  showConfirm('Hapus User', 'Yakin ingin menghapus user ini?', () => {
    save(LS.users, getUsers().filter(u => u.id !== id));
    toast('User dihapus'); renderManagement();
  });
}

function addRoom() {
  const nomor = upper(document.getElementById('r-nomor').value);
  const area = upper(document.getElementById('r-area').value);
  if (!nomor) return toast('Nomor ruangan wajib diisi', true);
  if (!AREAS.includes(area)) return toast('Area tidak valid', true);
  const rooms = getRooms();
  if (rooms.some(r => upper(r.nomor) === nomor)) return toast('Nomor ruangan sudah ada', true);
  rooms.push({ id: genId(), nomor, area });
  save(LS.rooms, rooms); toast('Ruangan ditambahkan'); renderManagement();
}
function editRoom(id) {
  const rooms = getRooms();
  const r = rooms.find(x => x.id === id); if (!r) return;
  openModal({
    title: 'Edit Ruangan', icon: '🏢',
    bodyHTML: mField('Nomor Ruangan', 'm-r-nomor', r.nomor, { uppercase: true })
      + `<div class="field"><label>Area</label>
          <select id="m-r-area">${AREAS.map(a => `<option ${a===r.area?'selected':''}>${a}</option>`).join('')}</select></div>`,
    okText: 'Simpan',
    onOk: () => {
      const nomor = upper(document.getElementById('m-r-nomor').value);
      const area = upper(document.getElementById('m-r-area').value);
      if (!nomor) return modalError('Nomor ruangan tidak boleh kosong');
      if (!AREAS.includes(area)) return modalError('Area tidak valid');
      if (rooms.some(x => x.id !== id && upper(x.nomor) === nomor)) return modalError('Nomor ruangan sudah ada');
      r.nomor = nomor; r.area = area;
      save(LS.rooms, rooms); closeModal(); toast('Ruangan diperbarui'); renderManagement();
    }
  });
}
function delRoom(id) {
  showConfirm('Hapus Ruangan', 'Hapus ruangan ini? Parameter ruangan ini juga akan terhapus.', () => {
    save(LS.rooms, getRooms().filter(r => r.id !== id));
    save(LS.params, getParams().filter(p => p.roomId !== id));
    if (openRoomId === id) openRoomId = null;
    toast('Ruangan & parameternya dihapus'); renderManagement();
  });
}

function addParam(roomId) {
  const nama = upper(document.getElementById('p-nama-' + roomId).value);
  const satuan = document.getElementById('p-satuan-' + roomId).value.trim();
  const min = document.getElementById('p-min-' + roomId).value;
  const max = document.getElementById('p-max-' + roomId).value;
  if (!nama || !satuan) return toast('Nama & satuan wajib diisi', true);
  if (min === '' || max === '') return toast('Min & max wajib diisi', true);
  if (Number(min) > Number(max)) return toast('Min tidak boleh lebih besar dari Max', true);
  const params = getParams();
  if (params.some(p => p.roomId === roomId && upper(p.nama) === nama))
    return toast('Nama parameter sudah ada di ruangan ini', true);
  params.push({ id: genId(), roomId, nama, satuan, min: Number(min), max: Number(max) });
  save(LS.params, params); toast('Parameter ditambahkan'); renderManagement();
}
function editParam(id) {
  const params = getParams();
  const p = params.find(x => x.id === id); if (!p) return;
  openModal({
    title: 'Edit Parameter', icon: '📐',
    bodyHTML: mField('Nama Parameter', 'm-p-nama', p.nama, { uppercase: true })
      + `<div class="field"><label>Satuan</label>
          <input id="m-p-satuan" value="${esc(p.satuan)}" list="m-satuanList">
          <datalist id="m-satuanList"><option value="°C"><option value="%"><option value="PA"></datalist></div>`
      + `<div style="display:flex;gap:12px">
          ${mField('Min', 'm-p-min', p.min, { type: 'number', step: 'any' })}
          ${mField('Max', 'm-p-max', p.max, { type: 'number', step: 'any' })}
        </div>`,
    okText: 'Simpan',
    onOk: () => {
      const nama = upper(document.getElementById('m-p-nama').value);
      const satuan = document.getElementById('m-p-satuan').value.trim();
      const min = Number(document.getElementById('m-p-min').value);
      const max = Number(document.getElementById('m-p-max').value);
      if (!nama) return modalError('Nama tidak boleh kosong');
      if (!satuan) return modalError('Satuan tidak boleh kosong');
      if (Number.isNaN(min) || Number.isNaN(max)) return modalError('Min/Max harus angka');
      if (min > max) return modalError('Min tidak boleh lebih besar dari Max');
      if (params.some(x => x.id !== id && x.roomId === p.roomId && upper(x.nama) === nama))
        return modalError('Nama parameter sudah ada di ruangan ini');
      p.nama = nama; p.satuan = satuan; p.min = min; p.max = max;
      save(LS.params, params); closeModal(); toast('Parameter diperbarui'); renderManagement();
    }
  });
}
function delParam(id) {
  showConfirm('Hapus Parameter', 'Hapus parameter ini?', () => {
    save(LS.params, getParams().filter(p => p.id !== id));
    toast('Parameter dihapus'); renderManagement();
  });
}

document.getElementById('loginNik').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
